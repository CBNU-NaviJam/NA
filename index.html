<div id="loading" class="page active">
  <div id="loading-container" style="display: none; margin: 10px 0;">
    <p>불러오는 중... <span id="progress-text">0%</span></p>
    <progress id="progress-bar" value="0" max="100" style="width: 100%;"></progress>
  </div>
</div>
<section id="home" class="page">
  <div class="home-main-phrase">
    <span>NAStock</span>
    <span>국회와 국민, 국회와 주식</span>
  </div>
  <form id="search-form">
    <div class="search-container">
      <button class="search-button">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
      <label for="search-input"></label>
      <input type="text" class="search-input" id="search-input" placeholder="검색어를 입력하세요." >
    </div>
  </form>
  <div class="home-sub-phrase">
    <span>
      NAStock<br>
      ■ 사용자는 자유롭게 국회의 의안에 의견을 남길 수 있습니다.<br>
      ■ 의안이 시행된 이후 주가 시장에 미치는 영향을 보여줍니다.
    </span>
  </div>
  <div class="home-list">
    <table>
      <thead>
      <tr>
        <th>번호</th>
        <th>대수</th>
        <th>의안번호</th>
        <th>의안명</th>
        <th>제안자</th>
        <th>제안일</th>
        <th>처리구분</th>
      </tr>
      </thead>
      <tbody id="home-list-body"></tbody>
    </table>
    <div id="pagination"></div>
  </div>
</section>
